  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0F0F0F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #loading-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #FF5C35, #ff8a65);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(255, 92, 53, 0.4);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .splash-logo span {
      font-size: 36px;
      font-weight: 900;
      color: white;
      letter-spacing: -1px;
    }

    .splash-name {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .splash-sub {
      color: #888888;
      font-size: 13px;
      margin-top: -16px;
    }

    .splash-bar {
      width: 200px;
      height: 3px;
      background: #1a1a1a;
      border-radius: 99px;
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF5C35, #B2FF33);
      border-radius: 99px;
      animation: loading 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(255,92,53,0.4); }
      50% { transform: scale(1.06); box-shadow: 0 12px 48px rgba(255,92,53,0.6); }
    }

    @keyframes loading {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-logo"><span>P</span></div>
    <div class="splash-name">Prem Moparthi</div>
    <div class="splash-sub">Full Stack Web &amp; Mobile Developer | Mobile Architect</div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() { splash.remove(); }, 500);
      }
    });
  </script>
</body>
